<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Management Gambar R2 | ACEFEST 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sora', sans-serif;
        }

        :root {
            --primary: #4A90E2;
            --primary-light: #7EB6FF;
            --secondary: #50E3C2;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --text: #5a6c7d;
            --white: #ffffff;
            --success: #27ae60;
            --warning: #e74c3c;
            --info: #3498db;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            --border-radius: 12px;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--dark) 0%, #34495e 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title {
            font-size: 28px;
            font-weight: 700;
        }

        .admin-subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 25px;
            background: var(--light);
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text);
            font-weight: 500;
        }

        .filters-section {
            padding: 20px 25px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
        }

        .filter-select, .filter-input {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .filter-select:focus, .filter-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #2ecc71 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning) 0%, #c0392b 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .content-section {
            padding: 25px;
        }

        .folder-breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--light);
            border-radius: var(--border-radius);
            font-weight: 500;
        }

        .breadcrumb-item {
            color: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .breadcrumb-item:hover {
            color: var(--dark);
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: var(--text);
        }

        .breadcrumb-item.active {
            color: var(--dark);
            font-weight: 600;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .image-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            border-color: var(--primary);
        }

        .image-container {
            height: 200px;
            overflow: hidden;
            position: relative;
            background: #f8f9fa;
        }

        .image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-card:hover .image-preview {
            transform: scale(1.05);
        }

        .image-info {
            padding: 15px;
        }

        .image-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.4;
        }

        .image-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text);
            margin-bottom: 10px;
        }

        .image-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e9ecef;
        }

        .action-btn {
            flex: 1;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .action-btn.view {
            background: var(--info);
            color: white;
        }

        .action-btn.download {
            background: var(--success);
            color: white;
        }

        .action-btn.delete {
            background: var(--warning);
            color: white;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading-container {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 16px;
            border: 1px solid #e9ecef;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-btn:hover:not(.active) {
            background: var(--light);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            max-width: 95%;
            max-height: 95%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: var(--border-radius);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .folder-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
        }

        .folder-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .folder-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .folder-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            word-break: break-word;
        }

        .folder-count {
            font-size: 12px;
            color: var(--text);
            background: var(--light);
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .root-files-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 20px 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--dark);
            font-size: 18px;
            font-weight: 600;
        }

        .debug-info {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            max-height: 200px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .filters-section {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-select, .filter-input {
                min-width: auto;
            }

            .images-grid {
                grid-template-columns: 1fr;
            }

            .folder-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .image-actions {
                flex-direction: column;
            }

            .admin-actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        .root-badge {
            background: #e74c3c;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <div class="admin-title">
                    <i class="fas fa-images"></i> Dashboard Management Gambar R2
                </div>
                <div class="admin-subtitle">ACE FEST 2025 - Monitoring & Management File Gambar</div>
            </div>
            <div class="admin-actions">
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button class="btn btn-success" onclick="loadFolders()">
                    <i class="fas fa-folder"></i> View Folders
                </button>
                <button class="btn btn-warning" onclick="debugR2()">
                    <i class="fas fa-bug"></i> Debug
                </button>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="total-images">0</div>
                <div class="stat-label">Total Gambar</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-size">0 MB</div>
                <div class="stat-label">Total Ukuran</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="verifikasi-count">0</div>
                <div class="stat-label">Foto Verifikasi</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="soal-count">0</div>
                <div class="stat-label">Gambar Soal</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="filter-group">
                <div class="filter-label">Folder Root</div>
                <select class="filter-select" id="folder-filter" onchange="changeRootFolder()">
                    <option value="">Semua Folder</option>
                    <option value="verifikasi">📷 verifikasi/</option>
                    <option value="soal_images">📚 soal_images/</option>
                    <option value="desain_poster">🎨 desain_poster/</option>
                </select>
            </div>
            <div class="filter-group">
                <div class="filter-label">Tipe File</div>
                <select class="filter-select" id="type-filter" onchange="loadImages()">
                    <option value="">Semua Tipe</option>
                    <option value="jpg">JPG</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="gif">GIF</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>
            <div class="filter-group">
                <div class="filter-label">Cari Nama File</div>
                <input type="text" class="filter-input" id="search-input" placeholder="Cari gambar..." oninput="debouncedSearch()">
            </div>
            <button class="btn btn-success" onclick="loadImages()">
                <i class="fas fa-search"></i> Terapkan Filter
            </button>
        </div>

        <div class="content-section">
            <div class="folder-breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item active">📁 Root Bucket</span>
            </div>

            <div id="folders-view">
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div>Memuat struktur folder...</div>
                </div>
            </div>

            <div id="images-view" style="display: none;">
                <!-- Images and folders will be loaded here -->
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination will be loaded here -->
            </div>

            <div class="debug-info" id="debug-info" style="display: none;">
                <!-- Debug information will be shown here -->
            </div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <img class="modal-image" id="modalImage" src="" alt="Preview">
        </div>
    </div>

    <script>
        const API_BASE = 'https://exam-system-backend.timacefest2025.workers.dev';
        let currentFolder = '';
        let currentPage = 1;
        const itemsPerPage = 12;
        let searchTimeout = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Initializing Admin Dashboard...');
            loadStats();
            loadFolders();
        });

        // Debounced search function
        function debouncedSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentPage = 1;
                loadImages();
            }, 500);
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/images/stats`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('total-images').textContent = data.stats.total_images.toLocaleString();
                    document.getElementById('total-size').textContent = data.stats.total_size_mb.toFixed(2) + ' MB';
                    document.getElementById('verifikasi-count').textContent = data.stats.verifikasi_count.toLocaleString();
                    document.getElementById('soal-count').textContent = data.stats.soal_count.toLocaleString();
                }
            } catch (error) {
                console.error('Error loading stats:', error);
                showError('Gagal memuat statistik: ' + error.message);
            }
        }

        // Load folders
        async function loadFolders() {
            const foldersView = document.getElementById('folders-view');
            const imagesView = document.getElementById('images-view');
            
            foldersView.style.display = 'block';
            imagesView.style.display = 'none';
            
            foldersView.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div>Memuat daftar folder...</div>
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/api/admin/images/folders`);
                const data = await response.json();
                
                if (data.success) {
                    displayFolders(data.folders);
                } else {
                    foldersView.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">❌</div>
                            <div>Gagal memuat folder: ${data.error}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading folders:', error);
                foldersView.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div>Error memuat folder: ${error.message}</div>
                    </div>
                `;
            }
        }

        // Display folders
        function displayFolders(folders) {
            const foldersView = document.getElementById('folders-view');
            
            if (folders.length === 0) {
                foldersView.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div>Tidak ada folder ditemukan di root bucket</div>
                        <button class="btn btn-primary" onclick="loadImages()" style="margin-top: 15px;">
                            Lihat File di Root
                        </button>
                    </div>
                `;
                return;
            }

            const normalFolders = folders.filter(f => !f.is_root_files);
            const rootFilesFolder = folders.find(f => f.is_root_files);

            let foldersHTML = '';

            if (normalFolders.length > 0) {
                foldersHTML += `
                    <h3 class="section-title">
                        <i class="fas fa-folder"></i> Folder di Root Bucket (${normalFolders.length})
                    </h3>
                    <div class="folder-grid">
                        ${normalFolders.map(folder => `
                            <div class="folder-card" onclick="navigateToFolder('${folder.full_path}')">
                                <div class="folder-icon">
                                    <i class="fas fa-folder"></i>
                                </div>
                                <div class="folder-name">${folder.name}</div>
                                <div class="folder-count">${folder.image_count} gambar</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (rootFilesFolder) {
                foldersHTML += `
                    <div class="root-files-section">
                        <h3 class="section-title">
                            <i class="fas fa-file"></i> File Langsung di Root Bucket
                        </h3>
                        <p style="margin-bottom: 15px; color: #666;">
                            Terdapat <strong>${rootFilesFolder.image_count} file</strong> 
                            (${(rootFilesFolder.total_size / 1024 / 1024).toFixed(2)} MB) 
                            yang langsung berada di root bucket.
                        </p>
                        <button class="btn btn-primary" onclick="navigateToFolder('')">
                            <i class="fas fa-eye"></i> Lihat File Root
                        </button>
                    </div>
                `;
            }

            foldersView.innerHTML = foldersHTML;
        }

        // Navigate to folder
        function navigateToFolder(folderPath) {
            currentFolder = folderPath;
            currentPage = 1;
            updateBreadcrumb();
            loadImages();
        }

        // Change root folder filter
        function changeRootFolder() {
            currentFolder = '';
            currentPage = 1;
            updateBreadcrumb();
            loadImages();
        }

        // Update breadcrumb
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            
            const rootFilter = document.getElementById('folder-filter').value;
            
            if (!currentFolder && !rootFilter) {
                breadcrumb.innerHTML = '<span class="breadcrumb-item active">📁 Root Bucket</span>';
            } else {
                let breadcrumbHTML = '<span class="breadcrumb-item" onclick="navigateToFolder(\'\')">📁 Root Bucket</span>';
                
                if (rootFilter) {
                    breadcrumbHTML += `
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-item active">${rootFilter}</span>
                    `;
                }
                
                if (currentFolder) {
                    const parts = currentFolder.split('/').filter(part => part !== '');
                    let currentPath = '';
                    
                    parts.forEach(part => {
                        currentPath += (currentPath ? '/' : '') + part;
                        breadcrumbHTML += `
                            <span class="breadcrumb-separator">/</span>
                            <span class="breadcrumb-item" onclick="navigateToFolder('${currentPath}')">${part}</span>
                        `;
                    });
                    
                    // Mark last part as active
                    const lastItem = breadcrumbHTML.lastIndexOf('breadcrumb-item');
                    if (lastItem !== -1) {
                        breadcrumbHTML = breadcrumbHTML.replace(/breadcrumb-item"[^>]*>$/, 'breadcrumb-item active">$&');
                    }
                }
                
                breadcrumb.innerHTML = breadcrumbHTML;
            }
        }

        // Load images and folders for current path
        async function loadImages() {
            const imagesView = document.getElementById('images-view');
            const foldersView = document.getElementById('folders-view');
            
            imagesView.style.display = 'block';
            foldersView.style.display = 'none';
            
            imagesView.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div>Memuat folder dan gambar...</div>
                </div>
            `;

            try {
                const folderFilter = document.getElementById('folder-filter').value;
                const typeFilter = document.getElementById('type-filter').value;
                const searchQuery = document.getElementById('search-input').value;
                
                const params = new URLSearchParams({
                    folder: currentFolder,
                    page: currentPage,
                    limit: itemsPerPage,
                    type: typeFilter,
                    search: searchQuery
                });

                if (folderFilter) {
                    params.set('root_folder', folderFilter);
                }

                const response = await fetch(`${API_BASE}/api/admin/images?${params}`);
                const data = await response.json();
                
                console.log('📦 API Response:', data);
                
                if (data.success) {
                    displayContent(data.images, data.folders, data.current_path);
                    displayPagination(data.pagination.total_items, data.pagination.total_pages);
                    
                    // Show debug info
                    showDebugInfo(data);
                } else {
                    imagesView.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">❌</div>
                            <div>Gagal memuat konten: ${data.error}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading images:', error);
                imagesView.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div>Error memuat konten: ${error.message}</div>
                    </div>
                `;
            }
        }

        // Display both folders and images
        function displayContent(images, folders, currentPath) {
            const imagesView = document.getElementById('images-view');
            
            let contentHTML = '';
            const isRootLevel = !currentPath.folder && !currentPath.root_folder;
            
            // Display folders first
            if (folders && folders.length > 0) {
                contentHTML += `
                    <h3 class="section-title">
                        <i class="fas fa-folder"></i> Subfolder (${folders.length})
                    </h3>
                    <div class="folder-grid">
                        ${folders.map(folder => `
                            <div class="folder-card" onclick="navigateToFolder('${folder.full_path}')">
                                <div class="folder-icon">
                                    <i class="fas fa-folder"></i>
                                </div>
                                <div class="folder-name">${folder.name}</div>
                                <div class="folder-count">${folder.image_count} gambar</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            // Display images
            if (images && images.length > 0) {
                contentHTML += `
                    <h3 class="section-title">
                        <i class="fas fa-images"></i> 
                        ${isRootLevel ? 'Gambar di Root Level' : 'Gambar'} 
                        (${images.length})
                    </h3>
                    <div class="images-grid">
                        ${images.map(image => `
                            <div class="image-card">
                                <div class="image-container">
                                    <img class="image-preview" 
                                         src="${image.url}" 
                                         alt="${image.key}"
                                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2Y4ZjlmYSIvPjx0ZXh0IHg9IjEwMCIgeT0iMTAwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM5OTk5OTkiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIwLjM1ZW0iPkdhbWJhciB0aWRhayBkYXBhdCBkaW11dGFrPC90ZXh0Pjwvc3ZnPg=='"
                                         onclick="viewImage('${image.key}')">
                                </div>
                                <div class="image-info">
                                    <div class="image-name" title="${image.key}">
                                        ${image.key.split('/').pop()}
                                        ${image.is_root_level ? ' <span class="root-badge">ROOT</span>' : ''}
                                    </div>
                                    <div class="image-meta">
                                        <span>${(image.size / 1024 / 1024).toFixed(2)} MB</span>
                                        <span>${new Date(image.uploaded).toLocaleDateString('id-ID')}</span>
                                    </div>
                                    <div class="image-actions">
                                        <button class="action-btn view" onclick="viewImage('${image.key}')">
                                            <i class="fas fa-eye"></i> View
                                        </button>
                                        <button class="action-btn download" onclick="downloadImage('${image.key}')">
                                            <i class="fas fa-download"></i> Download
                                        </button>
                                        <button class="action-btn delete" onclick="deleteImage('${image.key}')">
                                            <i class="fas fa-trash"></i> Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            // If no content at all
            if (!contentHTML) {
                contentHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div>Tidak ada folder atau gambar ditemukan</div>
                        <div style="margin-top: 10px; font-size: 14px; color: var(--text);">
                            ${currentPath.folder ? `Path: ${currentPath.folder}` : 
                              currentPath.root_folder ? `Root Folder: ${currentPath.root_folder}` : 
                              'Root bucket kosong atau tidak ada akses'}
                        </div>
                        <button class="btn btn-primary" onclick="loadFolders()" style="margin-top: 15px;">
                            Kembali ke Daftar Folder
                        </button>
                    </div>
                `;
            }
            
            imagesView.innerHTML = contentHTML;
        }

        // Display pagination
        function displayPagination(totalItems, totalPages) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            // Previous button
            if (currentPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">‹ Prev</button>`;
            } else {
                paginationHTML += `<button class="page-btn" disabled>‹ Prev</button>`;
            }
            
            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            if (startPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) {
                    paginationHTML += `<span class="page-btn">...</span>`;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span class="page-btn">...</span>`;
                }
                paginationHTML += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }
            
            // Next button
            if (currentPage < totalPages) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">Next ›</button>`;
            } else {
                paginationHTML += `<button class="page-btn" disabled>Next ›</button>`;
            }
            
            pagination.innerHTML = paginationHTML;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            loadImages();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // View image in modal
        function viewImage(imageKey) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            
            modalImage.src = `${API_BASE}/api/images/${imageKey}`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Download image
        function downloadImage(imageKey) {
            const link = document.createElement('a');
            link.href = `${API_BASE}/api/images/${imageKey}`;
            link.download = imageKey.split('/').pop();
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Delete image
        async function deleteImage(imageKey) {
            if (!confirm(`Apakah Anda yakin ingin menghapus gambar:\n"${imageKey}"?\n\nTindakan ini tidak dapat dibatalkan!`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/admin/images/delete`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ image_key: imageKey })
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Gambar berhasil dihapus!');
                    loadImages();
                    loadStats();
                } else {
                    showError('Gagal menghapus gambar: ' + data.error);
                }
            } catch (error) {
                console.error('Error deleting image:', error);
                showError('Error menghapus gambar: ' + error.message);
            }
        }

        // Refresh all data
        function refreshData() {
            loadStats();
            if (currentFolder || document.getElementById('folder-filter').value) {
                loadImages();
            } else {
                loadFolders();
            }
        }

        // Debug function
        async function debugR2() {
            try {
                const debugInfo = document.getElementById('debug-info');
                debugInfo.style.display = 'block';
                debugInfo.innerHTML = '<div class="loading-container"><div class="spinner"></div><div>Memuat info debug...</div></div>';

                const response = await fetch(`${API_BASE}/api/admin/debug/r2`);
                const data = await response.json();
                
                if (data.success) {
                    debugInfo.innerHTML = `
                        <h4>🐛 Debug Information</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <button class="btn btn-warning" onclick="document.getElementById('debug-info').style.display='none'" style="margin-top: 10px;">
                            Tutup Debug
                        </button>
                    `;
                } else {
                    debugInfo.innerHTML = `<div style="color: red;">Debug failed: ${data.error}</div>`;
                }
            } catch (error) {
                console.error('Debug error:', error);
                document.getElementById('debug-info').innerHTML = `<div style="color: red;">Debug error: ${error.message}</div>`;
            }
        }

        // Show debug info
        function showDebugInfo(data) {
            const debugInfo = document.getElementById('debug-info');
            if (data.debug) {
                debugInfo.style.display = 'block';
                debugInfo.innerHTML = `
                    <h4>🔍 Debug Info</h4>
                    <pre>${JSON.stringify(data.debug, null, 2)}</pre>
                    <button class="btn btn-warning" onclick="debugInfo.style.display='none'" style="margin-top: 10px; font-size: 12px;">
                        Tutup
                    </button>
                `;
            }
        }

        // Utility functions
        function showError(message) {
            alert('❌ ' + message);
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        // Close modal on background click and ESC key
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Export for global access
        window.debugR2 = debugR2;
        window.refreshData = refreshData;
        window.loadFolders = loadFolders;
        window.navigateToFolder = navigateToFolder;
        window.changePage = changePage;
        window.viewImage = viewImage;
        window.downloadImage = downloadImage;
        window.deleteImage = deleteImage;
        window.closeModal = closeModal;
    </script>
</body>
</html>
